  py-funkyheatmap:  {domain: visualization, upstream: {name: funkyheatmap, source: CRAN, url: https://cran.r-project.org/package=funkyheatmap}}
  py-gliph:         {domain: immune,       upstream: {name: turboGliph, source: GitHub, url: https://github.com/HetzDra/turboGliph}}
