name: Sync R-port catalog

on:
  schedule:
    - cron: "17 3 * * *"          # daily, 03:17 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [port-manifest-updated]

permissions:
  contents: write

concurrency:
  group: sync-ports
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Build src/assets/ports.json + catalog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_ports.py --out src/assets/ports.json

      - name: Build src/assets/github.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_github_stats.py --out src/assets/github.json

      - name: Commit when changed
        run: |
          FILES="src/assets/ports.json src/assets/catalog.json src/assets/github.json"
          if git diff --quiet -- $FILES; then
            echo "ports.json, catalog.json and github.json unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore(data): refresh R-port catalog, package catalog and GitHub stats"
          git push
