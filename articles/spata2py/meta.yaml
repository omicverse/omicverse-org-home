abstract: We assess selected SPATA2-inspired AnnData utilities using original SPATA2
  3.1.4 on 3,639 real retained DLPFC coordinates and five planted controls. Density
  labels agree under matched parameters, but the Python convex outline has about 14.3
  percent greater area than the original R outline and grid overlap is approximately
  0.875. Parameter sensitivity and unit-scale checks distinguish numerical invariants
  from algorithmic differences. The report does not claim reconstruction of SPATA2
  spatial gradients, histology analysis or its full object framework.
