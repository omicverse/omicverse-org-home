abstract: We evaluate selected SPLIT operations on real DLPFC counts with explicitly
  constructed layer references. Original R neighborhood scoring and Seurat balancing
  are executed at four thresholds, with and without label exchange. The experiments
  expose and repair missing expression substitution during label swapping, missing-class
  comparisons and single-type status propagation. After repair, aligned retained-cell
  expression differs by at most 5.68e-13, with matching scores and decisions. Rejected-row
  representation and the absence of independent clean-expression truth remain explicit
  limitations.
