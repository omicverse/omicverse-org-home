abstract: We evaluate the supported single-batch CytoTRACE Python core against original
  R on two real marrow datasets at 100, 200 and 400 cells. All six comparisons have
  identical ranks and detected-gene counts, with maximum score difference 5.55e-16.
  Restricting inputs to 3,000 high-variance genes changes rankings substantially more
  than cross-language numerical error. Three multi-panel figures separate real-data
  displays, stage-level numerical agreement, input sensitivity and descriptive execution
  times. Fast mode, batch correction and broader biological validation remain outside
  the measured scope.
